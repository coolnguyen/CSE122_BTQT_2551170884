<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 15 - Máy tính đơn giản</title>

        <div class="ban-phim">

            <button class="phim">5</button>
            <button class="phim">6</button>
            <button class="phim xanh">-</button>
            <button class="phim">1</button>
            <button class="phim">2</button>
            <button class="phim">3</button>
            <button class="phim xanh">+</button>
            <button class="phim rong-2">0</button>
            <button class="phim">.</button>
            <button class="phim luc">=</button>
        </div>
    </main>
    <script src="bai15.js"></script>
