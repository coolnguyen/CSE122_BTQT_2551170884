<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Form đăng kýt với Bootstrap</title>
    <link rel="stylesheet" href="bai26.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="card shadow">
        <div class="card-header bg-success text-white text-center py-3">
            <h4 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h4>
        </div>
        <div class="card-body p-4">
            <form class="row g-3">
                <div class="col-md-6">
                    <label for="hoTen" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="hoTen" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="col-md-6">
                    <label for="masv" class="form-label">Mã sinh viên</label>
                    <input type="text" class="form-control" id="masv" placeholder="22xxxxxx" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                </div>
                <div class="col-md-6">
                    <label for="sdt" class="form-label">Số điện thoại</label>
                    <input type="tel" class="form-control" id="sdt" placeholder="09xxxxxxxx" required>
                </div>
                <div class="col-12">
                    <label class="form-label d-block">Trình độ</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="trinhDo" id="td1" value="coban" checked>
                        <label class="form-check-label" for="td1">Cơ bản</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="trinhDo" id="td2" value="kha">
                        <label class="form-check-label" for="td2">Khá</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="trinhDo" id="td3" value="tot">
                        <label class="form-check-label" for="td3">Tốt</label>
                    </div>
                </div>
                <div class="col-12">
                    <label for="lop" class="form-label">Chọn lớp</label>
                    <select class="form-select" id="lop" required>
                        <option value="67CNTT1" selected>67CNTT1</option>
                        <option value="67CNTT2">67CNTT2</option>
                        <option value="67PM1">67PM1</option>
                        <option value="67PM2">67PM2</option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="camKet" checked required>
                        <label class="form-check-label" for="camKet">Tôi cam kết tự làm bài và quay video OBS</label>
                    </div>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                    <button type="reset" class="btn btn-outline-secondary">Nhập lại</button>
                    <button type="submit" class="btn btn-success">Đăng ký</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
