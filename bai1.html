<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BỐN MÙA</title>

    <style>
        .khung-bai{
            max-width: 600px;
            margin:auto;
            background-color:#FFFDE7;
            border: solid #9E9E9E;
            text-align: center
        }
        .tieu-de{
            color:#D40000;
            background-color:#FFD9E6;
        }
        .mau-xanh{
            color:#0033CC;
            font-style: italic   
        }

        .mau-do{
            color: #D40000;
            font-style: italic           
        }

        .khung-bai hr{
            width:55%;
            color:#0033CC;
        }

    </style>
</head>
<body>
    <main class="khung-bai">
        <h1 class="tieu-de">BỐN MÙA</h1>
        <p class="mau-xanh">
            Xuân về hoa nở khắp trời
            <br>
            Hạ sang nắng cháy rạng ngời phố quen
            <br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <p class="mau-do">
            Đông sang gió lạnh ben em đời chờ
            <br>
            Bốn mùa là bốn giấc mơ
            <br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>
        
        <p class="mau-xanh">
            Một năm rồi lại một năm
            <br>
            Vẫn còn câu hát thì thầm quê hương
            <br>
            Chờ xuấn nắg mới soi đường
        </p>

    </main>
</body>
</html>
