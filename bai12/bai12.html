<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - In lịch</title>
    <link rel="stylesheet" href="bai12.css">
</head>

<body>
    <main class="khung">
        <section id="lich" class="lich" hidden>
            <p id="nam"></p>
            <p id="thang"></p>
            <p id="ngay"></p>
            <p id="thu"></p>
        </section>
        <p id="loichao"></p>
        <div class="nhap">
            <label>Ngày
                <input type="number" id="o-ngay" min="1" max="31">
            </label>
            <label>Tháng
                <input type="number" id="o-thang" min="1" max="12">
            </label>
            <label>Năm
                <input type="number" id="o-nam" min="1000" max="9999">
            </label>
            <button id="nut">In lịch</button>
        </div>
    </main>
    <script src="bai12.js"></script>
</body>

</html>
